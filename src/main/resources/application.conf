app {
  routes {
    # If ask takes more time than this to complete the request is failed
    ask-timeout = 10s
  }
}

# Pekko's logging (loggers, loglevel) is set by at.ourproject.logging.LogSettings.pekkoLogging, which overrides
# this file; the level comes from LOG_LEVEL through logback.xml.
pekko {
  http.server.enable-http2 = on
}

keycloak {
  url = "http://localhost:7080/"
  url = ${?KEYCLOAK_URL}
  realm = "EEGFaktura"
  realm = ${?KEYCLOAK_REALM}
  clientId = "admin-cli"
  clientId = ${?KEYCLOAK_ADMIN_CLI_AUDIENCE}
  # No default: required, the service refuses to start without it.
  secret = ${?KEYCLOAK_ADMIN_CLI_SECRET}
}

keycloakAuthenticator {
  url = ${?KEYCLOAK_URL}
  realm = ${?KEYCLOAK_REALM}
  clientId = ${?KEYCLOAK_AUDIENCE}
  # Optional: JWKS-Fetch-URL getrennt vom Issuer. url/realm bestimmen den
  # erwarteten Issuer (muss die oeffentliche Keycloak-URL sein, iss-Check),
  # der JWKS-Fetch kann aber clusterintern laufen (LB-Hairpin + ingress-TLS).
  # Ohne diese Variable wird die Fetch-URL aus url/realm abgeleitet.
  jwksUrl = ${?KEYCLOAK_AUTHENTICATOR_JWKS_URL}
}

pekko.grpc.client {
    "register.RegisterEegService" {
      host = 127.0.0.1
      host = ${?REGISTER_SERVICE_HOST_EEG}
      port = 9092
      use-tls = false
    }
    "register.RegisterPontonService" {
      host = 127.0.0.1
      host = ${?REGISTER_SERVICE_HOST_PONTON}
      port = 9093
      use-tls = false
    }
}

slick.pgsql.vfeeg = {
    connectionPool = "HikariCP" //use HikariCP for our connection pool
    dataSourceClass = "org.postgresql.ds.PGSimpleDataSource" //Simple datasource with no connection pooling. The connection pool has already been specified with HikariCP.
    properties = {
        serverName = "localhost"
        serverName = ${?DATABASE_HOST}
        portNumber = "4432"
        portNumber = ${?DATABASE_PORT}
        databaseName = "postgresdb"
        databaseName = ${?DATABASE_DBNAME}
        user="postgresuser"
        user=${?DATABASE_USER}
        password="postgresPW"
        password=${?DATABASE_PASSWORD}
    }
    numThreads = 10
    queueSize=5000
    connectionTimeout=30000
    maxConnections=10
    minConnections=2
}